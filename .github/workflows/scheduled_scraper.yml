name: Scheduled Job Scraper

on:
  schedule:
    # 05:30 UTC = 11:00 AM IST (Morning Job Scraping Sweep)
    - cron: '30 5 * * *'
    # 16:30 UTC = 10:00 PM IST (Evening Job Scraping Sweep)
    - cron: '30 16 * * *'
  workflow_dispatch:

jobs:
  run-scraper:
    name: Run Scraper CLI
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Scraper Across All Adapters
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_TOKEN }}
          LI_AT: ${{ secrets.LI_AT }}
        run: |
          python run_scraper.py --all
